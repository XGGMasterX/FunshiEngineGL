name: CI

on:
  push:
  pull_request:

jobs:
  # Build COMPLETO del engine en Linux (el entorno real de desarrollo) + las
  # pruebas headless del subsistema FileManager.
  engine-ubuntu:
    name: Engine + tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglfw3-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libglm-dev \
            libncurses-dev \
            libassimp-dev \
            libbullet-dev \
            libxrandr-dev \
            libxi-dev

      - name: Configurar
        run: cmake -B build -S FunshiEngineGL -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_ASAN=OFF

      - name: Compilar engine
        run: cmake --build build --target FunshiEngineGL

      - name: Compilar pruebas
        run: cmake --build build --target filemanager-tests configuracion-tests assetmanager-tests

      - name: Ejecutar pruebas
        run: ctest --test-dir build --output-on-failure

  # Pruebas headless multiplataforma: compilan y corren sin la pila grafica
  # en los tres sistemas (con BUILD_ENGINE=OFF no se requieren libs externas).
  tests-multiplataforma:
    name: Pruebas FileManager (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar (solo pruebas, sin engine)
        run: cmake -B build -S FunshiEngineGL -G Ninja -DBUILD_ENGINE=OFF -DENABLE_ASAN=OFF

      - name: Compilar pruebas
        run: cmake --build build --target filemanager-tests configuracion-tests assetmanager-tests

      - name: Ejecutar pruebas
        run: ctest --test-dir build --output-on-failure